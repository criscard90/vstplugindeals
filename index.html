<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plugin Deals</title>
<meta name="description" content="Offerte e plugin gratuiti per VST, raccolti con scraping diretto da Audio Plugin Deals.">

<!-- PWA -->
<link rel="manifest" href="manifest.json?v=2.0.2">
<meta name="theme-color" content="#0b1120">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icons/favicon.png" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="app-header">
  <h1>
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M2 12h2.5l2-6 3 13 3-9 2 4H22" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    Plugin Deals
  </h1>
  <p class="tagline">Dati da audiopluginguy.com</p>
</header>

<main class="app-main">
  <div class="toolbar">
    <label class="search-wrap">
      <span class="visually-hidden">Cerca plugin o sviluppatore</span>
      <input type="search" id="search" placeholder="Cerca plugin, sviluppatore o tag…" autocomplete="off">
    </label>

    <div class="toolbar-row">
      <label class="switch">
        <input type="checkbox" id="free-only" checked>
        <span>Solo gratuiti</span>
      </label>

      <div class="toolbar-actions">
        <button type="button" id="install" class="btn btn-install" hidden>
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
            <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z" fill="currentColor"/>
          </svg>
          Installa
        </button>
        <button type="button" id="refresh" class="btn btn-ghost">Aggiorna</button>
        <button type="button" id="reset" class="btn btn-danger">Reset</button>
      </div>
    </div>
  </div>

  <nav id="filters" aria-label="Filtri">
    <button type="button" data-filter="all" data-label="Tutti" class="active">Tutti</button>
    <button type="button" data-filter="unredeemed" data-label="Da riscattare">Da riscattare</button>
    <button type="button" data-filter="seen" data-label="Visti">Visti</button>
    <button type="button" data-filter="redeemed" data-label="Riscattati">Riscattati</button>
    <button type="button" data-filter="ignored" data-label="Non mi interessa">Non mi interessa</button>
  </nav>

  <p id="status" class="status" hidden></p>
  <p id="summary" class="summary"></p>

  <div id="loader" class="loader">
    <span class="spinner" aria-hidden="true"></span>
    <p>Sintonizzando le offerte…</p>
  </div>

  <section id="error" class="panel-error" hidden></section>

  <p id="empty" class="empty" hidden></p>

  <section id="deals" class="deals" aria-label="Elenco offerte" aria-live="polite"></section>
</main>

<footer class="app-footer">
  <p>
    I link sono affiliati: acquistando tramite questi link sostieni il sito.
    I dati arrivano da
    <a href="https://www.audiopluginguy.com/deals/" target="_blank" rel="noopener noreferrer">Audio Plugin Deals</a>.
  </p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
