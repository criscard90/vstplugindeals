name: Aggiorna Deal VST

on:
  schedule:
    # Ogni 6 ore. In ora italiana (Europe/Rome):
    #   ora legale, fine marzo -> fine ottobre: 02:00, 08:00, 14:00, 20:00
    #   ora standard, fine ottobre -> fine marzo: 01:00, 07:00, 13:00, 19:00
    # Un solo cron non puo' tenere ferme entrambe le stagioni: l'ora legale
    # la decide l'UE e slitta di 1h a fine ottobre. Con questo scaglione
    # l'estate (7 mesi su 12) cade esattamente sulle ore italiane "tonde".
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # Permette di avviare l'aggiornamento a mano con un click da GitHub

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esegui scraping e genera deals.json
        run: node scripts/build-deals.mjs

      - name: Esegui test di integrità
        run: npm test

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --staged --quiet; then
            echo "Nessun nuovo deal da aggiornare."
          else
            git commit -m "Auto-update deals.json [skip ci]"
            git push
          fi
