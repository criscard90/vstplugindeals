name: Aggiorna Deal VST

on:
  schedule:
    # Ogni ora, al minuto :07. Il minuto e' volutamente NON le 00: all'inizio
    # dell'ora GitHub ha il carico piu' alto e i run programmati rischiano
    # ritardi importanti o di essere saltati (docs -> evento "schedule").
    # Il cron e' in UTC ma lo scarto CET/CEST e' di ore intere, quindi in
    # Italia il run cade sempre alle :07 di ogni ora, tutto l'anno.
    - cron: '7 * * * *'
  workflow_dispatch: # Permette di avviare l'aggiornamento a mano con un click da GitHub

# Un solo run alla volta: se una esecuzione va lenta la successiva aspetta
# invece di fare scraping concorrente sullo stesso deals.json.
concurrency:
  group: update-deals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Esegui scraping e genera deals.json
        run: node scripts/build-deals.mjs

      - name: Esegui test di integrità
        run: npm test

      - name: Commit e push se ci sono modifiche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deals.json
          if git diff --staged --quiet; then
            echo "Nessun nuovo deal da aggiornare."
          else
            git commit -m "Auto-update deals.json [skip ci]"
            git push
          fi
